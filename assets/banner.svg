<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ff4e50" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0844" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>

    <style>
      .radar-sweep {
        transform-origin: 1050px 200px;
        animation: rotateRadar 8s linear infinite;
      }
      .node-pulse {
        animation: pulseEffect 3s ease-in-out infinite alternate;
      }
      .wave-pulse {
        animation: waveExpand 4s ease-out infinite;
      }
      .floating-particle {
        animation: floatParticle 6s ease-in-out infinite alternate;
      }
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseEffect {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes waveExpand {
        0% { r: 10px; opacity: 0.8; }
        100% { r: 120px; opacity: 0; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
        100% { transform: translateY(6px) translateX(-8px); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#cyberGrid)" />

  <!-- Background Dynamic / Animated Radar Visual on Right -->
  <g opacity="0.6">
    <circle cx="1050" cy="200" r="140" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1050" cy="200" r="100" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2" />
    <circle cx="1050" cy="200" r="60" fill="none" stroke="#ff0844" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="1050" cy="200" r="20" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="1050" cy="200" class="wave-pulse" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    
    <!-- Rotating Sweep -->
    <path class="radar-sweep" d="M 1050 200 L 1190 200 A 140 140 0 0 0 1050 60 Z" fill="url(#cyberCyan)" opacity="0.12" />
    <line x1="910" y1="200" x2="1190" y2="200" stroke="#00f2fe" stroke-width="0.7" opacity="0.3" />
    <line x1="1050" y1="60" x2="1050" y2="340" stroke="#00f2fe" stroke-width="0.7" opacity="0.3" />
  </g>

  <!-- Dynamic Cyber Nodes / Ambient Floating Elements (Background) -->
  <g class="floating-particle" opacity="0.5">
    <circle cx="120" cy="80" r="3" fill="#00f2fe" filter="url(#glowCyan)" />
    <circle cx="340" cy="50" r="2.5" fill="#ff0844" filter="url(#glowRed)" />
    <circle cx="80" cy="320" r="3" fill="#00f2fe" />
    <circle cx="680" cy="60" r="2" fill="#00f2fe" />
    <circle cx="950" cy="350" r="3.5" fill="#ff0844" filter="url(#glowRed)" />
    <path d="M 120 80 L 180 120 L 260 90" fill="none" stroke="#00f2fe" stroke-width="0.8" opacity="0.3" />
    <path d="M 950 350 L 1020 310" fill="none" stroke="#ff0844" stroke-width="0.8" opacity="0.3" />
  </g>

  <!-- Left Accent / Cyber Shield Graphic -->
  <g transform="translate(60, 130)">
    <!-- Hexagonal Border -->
    <polygon points="50,0 100,28 100,85 50,114 0,85 0,28" fill="#0b1329" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#glowCyan)" />
    <!-- Terminal Crosshairs / Emblem inside -->
    <path d="M 30,57 L 70,57 M 50,37 L 50,77" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="50" cy="57" r="16" fill="none" stroke="#ff0844" stroke-width="2" stroke-dasharray="5 3" />
    <circle cx="50" cy="57" r="4" fill="#00f2fe" />
  </g>

  <!-- Decorative Corner Brackets -->
  <path d="M 20,40 L 20,20 L 40,20" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7" />
  <path d="M 1180,40 L 1180,20 L 1160,20" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7" />
  <path d="M 20,360 L 20,380 L 40,380" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7" />
  <path d="M 1180,360 L 1180,380 L 1160,380" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7" />

  <!-- FOREGROUND TEXT (Crisp, High Contrast, Guaranteed Unobscured) -->
  <g transform="translate(195, 0)">
    <!-- Category Badge -->
    <rect x="0" y="85" width="280" height="28" rx="6" fill="#111c38" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
    <circle cx="15" cy="99" r="4" fill="#00f2fe" />
    <text x="28" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="1.5">OFFENSIVE SECURITY DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome <tspan fill="url(#cyberCyan)">Cybersecurity</tspan> &amp;
    </text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#neonRed)" letter-spacing="-0.5">
      Penetration Testing
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated Ecosystem of Breach &amp; Attack Simulation (BAS), Adversary Emulation &amp; Offensive Security Tooling
    </text>

    <!-- Feature Tags Pill Row -->
    <g transform="translate(0, 290)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ Adversary Emulation</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="105" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="156" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f43f5e">🎯 BAS Platforms</text>

      <!-- Pill 3 -->
      <rect x="259" y="0" width="135" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="273" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a855f7">🛡️ Purple Teaming</text>

      <!-- Pill 4 -->
      <rect x="406" y="0" width="145" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="420" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">🔓 Continuous Validation</text>
    </g>
  </g>
</svg>
